<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>ポートフォリオ</title>
  <link rel="stylesheet" href="portfolio.css">
</head>

<body>

  <header>
    <h1>Portfolio</h1>
    <p>学習記録・制作物をまとめたポートフォリオです</p>
    <p>Pythonを使ったWebアプリを開発しています</p>
  </header>

  <main>

    <section class="projects">
      <h2>Projects</h2>
      <div class="project-card">
        <div class="project-text">

          <h3>コード記述練習アプリ</h3>
          <p>Pythonのコードを入力し、出力結果で正誤判定を行うアプリです</p>

          <a class="btn" href="https://nnk102938.github.io/code-practice-app/" alt="詳細ページ">
            詳細を見る
          </a>
        </div>

        <div class="project-image">
          <img src="images/code-app-top.webp" alt="コード記述練習アプリのスクリーンショット" class="zoom-img">
        </div>
      </div>
    </section>


    <section class="skills">
      <h2>Skills</h2>

      <div class="tags">
        <span>Python</span>
        <span>Java Script</span>
        <span>HTML</span>
        <span>CSS</span>
      </div>
    </section>

    <section class="about">
      <h2>About Me</h2>
      <p>
        職業訓練校でPythonとWeb開発を学習中です。<br>
        主にPythonを使ってWebアプリを開発しています。<br>
      </p>
    </section>

  </main>

  <footer>
    <p>© 2026 Nonaka</p>
  </footer>


  <!-- 画像拡大表示用 -->
  <div id="modal" class="modal">
    <img id="modalImg" class="modal-content">
  </div>
  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    document.querySelectorAll(".zoom-img").forEach(img => {
      img.addEventListener("click", () => {
        modal.style.display = "flex";
        modalImg.src = img.src;
      });
    });

    modal.addEventListener("click", () => {
      modal.style.display = "none";
    });
  </script>

</body>

</html>
